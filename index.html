<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ece9e1" />
    <meta name="description" content="A kinetic territory simulation made from bouncing balls and colored bricks." />
    <title>Brick Territories</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="stage">
      <header class="masthead">
        <div class="title-group">
          <h1>Brick Territories</h1>
          <button class="outline-button" id="stats-toggle" type="button" aria-expanded="false" aria-controls="stats-panel">
            <span aria-hidden="true">∿</span> Stats
          </button>
          <div class="inspiration">
            <button class="text-button" id="inspiration-toggle" type="button" aria-expanded="false" aria-controls="inspiration-link">Inspiration</button>
            <a id="inspiration-link" href="https://twitter.com/jagarikin/status/1388660839205326851" target="_blank" rel="noreferrer" hidden>Original post by jagarikin ↗</a>
          </div>
        </div>
        <div class="status" aria-live="polite">
          <span><i id="status-dot"></i><b id="status-text">running</b></span>
          <time id="elapsed">00:00</time>
        </div>
      </header>

      <section class="world-frame" aria-label="Territory simulation">
        <canvas id="world"></canvas>
        <canvas id="fluid-world" hidden></canvas>

        <div id="cell-tooltip" class="cell-tooltip" role="tooltip" hidden>
          <strong><i id="tooltip-swatch"></i><span id="tooltip-territory"></span></strong>
          <span><b>Area</b><output id="tooltip-area"></output></span>
          <span><b>Ball speed</b><output id="tooltip-speed"></output></span>
        </div>

        <section id="stats-panel" class="stats-panel" aria-label="Territory statistics" hidden>
          <div class="stats-heading">
            <span>Area history</span>
            <button id="stats-close" type="button" aria-label="Close statistics">×</button>
          </div>
          <div class="chart-wrap"><canvas id="stats-chart"></canvas></div>
          <div id="stats-list" class="stats-list"></div>
        </section>

        <div class="simulation-options">
          <label class="webgl-toggle">
            <input id="webgl" type="checkbox" checked />
            <span>WebGL</span>
          </label>
          <label class="audio-mode-control">
            <span>Audio</span>
            <select id="audio-mode">
              <option value="off">Off</option>
              <option value="drones">Territory drones</option>
              <option value="bells">Capture bells</option>
              <option value="swarm">Ball swarm</option>
              <option value="wind">Frontier wind</option>
              <option value="pulse">Map pulse</option>
            </select>
          </label>
        </div>

        <button id="pause" class="pause-button" type="button" aria-label="Pause simulation">
          <span class="pause-icon" aria-hidden="true"></span>
          <span id="pause-label">pause</span>
        </button>
      </section>

      <form id="controls" class="controls">
        <label class="control">
          <span><b>Territories</b><output id="territories-value">10</output></span>
          <input id="territories" name="territories" type="range" min="2" max="24" step="1" value="10" aria-label="Territories" />
        </label>
        <label class="control">
          <span><b>Brick size</b><output id="brick-value">20</output></span>
          <input id="brick" name="brick" type="range" min="7" max="28" step="1" value="20" aria-label="Brick size" />
        </label>
        <label class="control">
          <span><b>Mean speed</b><output id="speed-value">1.3</output></span>
          <input id="speed" name="speed" type="range" min="0.5" max="5" step="0.1" value="1.3" aria-label="Mean speed" />
        </label>
        <label class="control">
          <span><b>Ball size</b><output id="ball-value">0.5</output></span>
          <input id="ball" name="ball" type="range" min="0.35" max="0.8" step="0.05" value="0.5" aria-label="Ball size" />
        </label>
        <label class="control">
          <span><b>Seed</b><output id="seed-value">414</output></span>
          <input id="seed" name="seed" type="range" min="1" max="999" step="1" value="414" aria-label="Seed" />
        </label>
        <button class="reset-button" type="submit"><span>Reset</span><span aria-hidden="true">↻</span></button>
      </form>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
